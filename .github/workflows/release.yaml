on:
  push:
    tags: ['v*']

name: release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, artifact: zip}
          - {os: ubuntu-latest, artifact: tar.gz}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches DESCRIPTION
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          described=$(grep '^Version:' DESCRIPTION | sed 's/Version: *//')
          if [ "$tag" != "$described" ]; then
            echo "Tag v$tag does not match DESCRIPTION version $described." >&2
            exit 1
          fi
        shell: bash
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Build source package
        if: matrix.config.artifact == 'tar.gz'
        run: R CMD build .
      - name: Build Windows binary
        if: matrix.config.artifact == 'zip'
        run: R CMD INSTALL --build .
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          fail_on_unmatched_files: false

