on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Install BC Sans for the site and figures
        shell: bash
        run: |
          set -euo pipefail
          font_ref="c2379ef6608ef962406557ef9022482593880e66"
          font_url="https://raw.githubusercontent.com/bcgov/bc-sans/${font_ref}/fonts"
          asset_dir="pkgdown/assets/fonts"
          system_dir="${HOME}/.local/share/fonts"
          mkdir -p "${asset_dir}" "${system_dir}"
          for file in BCSans-Regular.woff2 BCSans-Italic.woff2 BCSans-Bold.woff2 BCSans-BoldItalic.woff2; do
            curl --fail --location --retry 3 "${font_url}/${file}" --output "${asset_dir}/${file}"
            cp "${asset_dir}/${file}" "${system_dir}/${file}"
          done
          curl --fail --location --retry 3 +            "https://raw.githubusercontent.com/bcgov/bc-sans/${font_ref}/LICENSE" +            --output "${asset_dir}/BC-Sans-LICENSE.txt"
          fc-cache -f
          Rscript -e 'stopifnot("BC Sans" %in% systemfonts::system_fonts()$family)'
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Check rendered surveillance figure and BC Sans
        shell: bash
        run: |
          test -s docs/fonts/BCSans-Regular.woff2
          test -s docs/fonts/BC-Sans-LICENSE.txt
          grep -Fq 'fonts/BCSans-Regular.woff2' docs/extra.css
          grep -Fq 'plot-example-1.png' docs/articles/surveillance.html
      - name: Check reference index is complete
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artefact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
