url: https://temuulene.github.io/islhepi/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, articles, reference, news]
  components:
    articles:
      text: Guides
      menu:
        - text: Getting started
          href: articles/islhepi.html
        - text: Routine surveillance
          href: articles/surveillance.html
        - text: BC population and geography data
          href: articles/bcdata.html

articles:
  - title: Surveillance
    contents:
      - surveillance
  - title: Data access
    contents:
      - bcdata

reference:
  - title: Routine surveillance
    desc: >
      Check event records, build complete period counts, calculate transparent
      historical baselines and prepare current-window reporting tables.
    contents:
      - islh_check_events
      - islh_count_events
      - islh_surveillance_baseline
      - islh_surveillance_snapshot

  - title: BC population and geography
    desc: >
      Retrieve standardised denominators and boundaries from pinned BC Data
      Catalogue sources, with consistent keys for checked joins.
    contents:
      - islh_bc_population
      - islh_bc_geography
      - islh_bc_sources

  - title: Rates and confidence intervals
    desc: >
      Group ages and calculate crude or directly standardised rates with
      explicit interval methods and validated inputs.
    contents:
      - islh_age_group
      - islh_crude_rate
      - islh_dsr
      - islh_ci_poisson

  - title: Disclosure control
    desc: >
      Apply suppression or rounding mechanics. Thresholds and rounding bases
      must be supplied explicitly for the release being prepared.
    contents:
      - islh_suppress
      - islh_suppress_table
      - islh_round_base
